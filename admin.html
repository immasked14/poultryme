<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoultryMe Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar"><div class="container nav-inner">
  <div class="logo">🐔 PoultryMe Admin</div>
  <ul class="nav-links"><li><a href="index.html">Back to Site</a></li></ul>
</nav></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="#dashboard">Dashboard</a>
    <a href="#products">Products</a>
  </aside>
  <main class="admin-main">
    <section id="dashboard" class="section"><div class="container">
      <h2 class="section-title">Dashboard</h2>
      <div class="admin-cards">
        <div class="admin-card"><h3 id="total-products">0</h3><p>Total Products</p></div>
        <div class="admin-card"><h3 id="available">0</h3><p>Available</p></div>
        <div class="admin-card"><h3 id="outstock">0</h3><p>Out of Stock</p></div>
        <div class="admin-card"><h3 id="inv-value">₱0</h3><p>Inventory Value</p></div>
      </div>
    </section>
    <section id="products" class="section"><div class="container">
      <h2 class="section-title">Products</h2>
      <div class="toolbar">
        <select id="filter-age"><option value="all">All Ages</option><option value="4">4 Months</option><option value="5">5 Months</option><option value="6+">6+ Months</option></select>
        <select id="filter-avail"><option value="all">All Status</option><option value="In Stock">In Stock</option><option value="Out of Stock">Out of Stock</option></select>
      </div>
      <h3>Add Chicken</h3>
      <form id="add-form" class="form-grid">
        <input name="name" placeholder="Name" aria-label="Name" required>
        <input name="breed" placeholder="Breed" aria-label="Breed" required>
        <input name="age" placeholder="Age (e.g. 4 Months)" aria-label="Age" required>
        <select name="ageGroup" aria-label="Age group" required><option value="4">4</option><option value="5">5</option><option value="6+">6+</option></select>
        <input name="price" type="number" placeholder="Price" aria-label="Price" required>
        <input name="image" placeholder="Image path" aria-label="Image path" value="images/pexels.jpg">
        <select name="availability" aria-label="Availability" required><option>In Stock</option><option>Out of Stock</option></select>
        <input name="purpose" placeholder="Purpose" aria-label="Purpose" value="Egg-laying">
        <textarea name="description" placeholder="Description" aria-label="Description" style="grid-column:1/-1"></textarea>
        <button class="btn btn-primary" type="submit" style="grid-column:1/-1">Add Chicken</button>
      </form>
      <h3 style="margin-top:24px">Inventory</h3>
      <table class="admin-table"><thead><tr><th>Image</th><th>Name</th><th>Breed</th><th>Age</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="product-table-body"></tbody></table>
      <p id="empty-state" class="empty-msg" style="display:none">No products match.</p>
    </section>
  </main>
</div>
<script src="common.js"></script>
<script src="admin.js"></script>
</body></html>
